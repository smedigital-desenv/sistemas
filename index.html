<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Sistemas - SME Ribeirão Preto</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link 
      href="https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DM+Sans:wght@400;500;700&display=swap" 
      rel="stylesheet" 
    />

    <style>
        :root {
            /* Core colors */
            --color-bg-primary: #0f1117;
            --color-bg-secondary: #1a1f2e;
            --color-bg-tertiary: #252d3d;
            
            /* Text colors */
            --color-text-primary: #e4e6eb;
            --color-text-secondary: #a8adbf;
            --color-text-tertiary: #6e7693;
            
            /* Accent */
            --color-accent: #5a67d8;
            --color-accent-hover: #4c51bf;
            --color-accent-light: #6b7ee8;
            
            /* Status colors */
            --color-success: #48bb78;
            --color-warning: #ed8936;
            --color-error: #f56565;
            
            /* Borders */
            --color-border: #30384a;
            
            /* Spacing */
            --spacing-xs: 0.25rem;
            --spacing-sm: 0.5rem;
            --spacing-md: 1rem;
            --spacing-lg: 1.5rem;
            --spacing-xl: 2rem;
            --spacing-2xl: 3rem;
            
            /* Typography */
            --font-display: 'DM Sans', sans-serif;
            --font-body: 'DM Sans', sans-serif;
            --font-mono: 'DM Mono', monospace;
            
            --font-size-xs: 0.75rem;
            --font-size-sm: 0.875rem;
            --font-size-base: 1rem;
            --font-size-lg: 1.125rem;
            --font-size-xl: 1.25rem;
            --font-size-2xl: 1.5rem;
            --font-size-3xl: 2rem;
            
            /* Line heights */
            --line-height-tight: 1.2;
            --line-height-normal: 1.5;
            --line-height-relaxed: 1.75;
            
            /* Border radius */
            --radius-sm: 4px;
            --radius-md: 8px;
            --radius-lg: 12px;
            --radius-xl: 16px;
            
            /* Transitions */
            --transition-fast: 150ms ease;
            --transition-base: 300ms ease;
            --transition-slow: 500ms ease;
        }

        @media (prefers-reduced-motion: reduce) {
            * {
                animation-duration: 0.01ms !important;
                animation-iteration-count: 1 !important;
                transition-duration: 0.01ms !important;
            }
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html {
            scroll-behavior: smooth;
        }

        body {
            background: linear-gradient(135deg, var(--color-bg-primary) 0%, var(--color-bg-secondary) 100%);
            color: var(--color-text-primary);
            font-family: var(--font-body);
            font-size: var(--font-size-base);
            line-height: var(--line-height-normal);
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        h1, h2, h3, h4, h5, h6 {
            font-family: var(--font-display);
            font-weight: 700;
            line-height: var(--line-height-tight);
        }

        h1 {
            font-size: var(--font-size-3xl);
        }

        h2 {
            font-size: var(--font-size-2xl);
        }

        h3 {
            font-size: var(--font-size-xl);
        }

        a {
            color: var(--color-accent);
            text-decoration: none;
            transition: color var(--transition-fast);
        }

        a:hover {
            color: var(--color-accent-light);
        }

        a:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 2px;
            border-radius: var(--radius-sm);
        }

        button {
            font-family: inherit;
            font-size: inherit;
            border: none;
            background: none;
            cursor: pointer;
        }

        ::-webkit-scrollbar {
            width: 8px;
            height: 8px;
        }

        ::-webkit-scrollbar-track {
            background: var(--color-bg-primary);
        }

        ::-webkit-scrollbar-thumb {
            background: var(--color-border);
            border-radius: var(--radius-sm);
        }

        ::-webkit-scrollbar-thumb:hover {
            background: var(--color-text-tertiary);
        }

        /* Header */
        .header {
            padding: var(--spacing-2xl) var(--spacing-lg);
            border-bottom: 1px solid var(--color-border);
            background: var(--color-bg-secondary);
        }

        .header-content {
            max-width: 1200px;
            margin: 0 auto;
        }

        .header h1 {
            color: var(--color-text-primary);
            margin-bottom: var(--spacing-sm);
        }

        .header p {
            color: var(--color-text-secondary);
            font-size: var(--font-size-sm);
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        /* Main content */
        .main {
            flex: 1;
            padding: var(--spacing-2xl) var(--spacing-lg);
            max-width: 1200px;
            margin: 0 auto;
            width: 100%;
        }

        .intro {
            text-align: center;
            margin-bottom: var(--spacing-2xl);
        }

        .intro h2 {
            color: var(--color-text-primary);
            margin-bottom: var(--spacing-md);
        }

        .intro p {
            color: var(--color-text-secondary);
            font-size: var(--font-size-lg);
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: var(--spacing-xl);
            margin-bottom: var(--spacing-2xl);
        }

        /* Cards */
        .card {
            position: relative;
            padding: var(--spacing-xl);
            border-radius: var(--radius-xl);
            background: var(--color-bg-tertiary);
            border: 1px solid var(--color-border);
            text-align: left;
            transition: all var(--transition-base);
            display: flex;
            flex-direction: column;
            gap: var(--spacing-md);
            cursor: pointer;
        }

        .card:hover {
            border-color: var(--color-accent);
            transform: translateY(-4px);
            background: var(--color-bg-secondary);
        }

        .card:focus-visible {
            outline: 2px solid var(--color-accent);
            outline-offset: 2px;
        }

        .card:disabled {
            opacity: 0.7;
            cursor: not-allowed;
        }

        .card-icon {
            font-size: 2.5rem;
            line-height: 1;
            margin-bottom: var(--spacing-sm);
        }

        .card h3 {
            color: var(--color-text-primary);
            margin: 0;
        }

        .card p {
            color: var(--color-text-secondary);
            font-size: var(--font-size-sm);
            margin: 0;
            flex-grow: 1;
        }

        .card-arrow {
            color: var(--color-text-tertiary);
            font-size: var(--font-size-lg);
            transition: all var(--transition-base);
        }

        .card:hover .card-arrow {
            color: var(--color-accent);
            transform: translateX(4px);
        }

        /* Color variants */
        .card--accent {
            border-color: rgba(90, 103, 216, 0.1);
        }

        .card--accent:hover {
            border-color: var(--color-accent);
            box-shadow: 0 0 20px rgba(90, 103, 216, 0.1);
        }

        .card--success {
            border-color: rgba(72, 187, 120, 0.1);
        }

        .card--success:hover {
            border-color: var(--color-success);
            box-shadow: 0 0 20px rgba(72, 187, 120, 0.1);
        }

        /* Footer */
        .footer {
            padding: var(--spacing-xl) var(--spacing-lg);
            border-top: 1px solid var(--color-border);
            background: var(--color-bg-secondary);
            text-align: center;
            color: var(--color-text-tertiary);
            font-size: var(--font-size-sm);
            margin-top: auto;
        }

        /* Loading indicator */
        .loading-indicator {
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            height: 3px;
            background: linear-gradient(
                90deg,
                var(--color-accent),
                var(--color-accent-light),
                var(--color-accent)
            );
            animation: loading 0.8s ease-in-out;
        }

        @keyframes loading {
            0% {
                width: 0;
            }
            50% {
                width: 70%;
            }
            100% {
                width: 100%;
            }
        }

        /* Responsive */
        @media (max-width: 768px) {
            .header {
                padding: var(--spacing-xl) var(--spacing-md);
            }

            .header h1 {
                font-size: var(--font-size-2xl);
            }

            .main {
                padding: var(--spacing-xl) var(--spacing-md);
            }

            .grid {
                grid-template-columns: 1fr;
                gap: var(--spacing-lg);
            }

            .card {
                padding: var(--spacing-lg);
            }

            .intro {
                margin-bottom: var(--spacing-xl);
            }

            .intro h2 {
                font-size: var(--font-size-2xl);
            }

            .intro p {
                font-size: var(--font-size-base);
            }
        }

        @media (max-width: 480px) {
            .header h1 {
                font-size: var(--font-size-2xl);
            }

            .main {
                padding: var(--spacing-lg) var(--spacing-md);
            }

            .card {
                padding: var(--spacing-md);
                gap: var(--spacing-sm);
            }

            .card h3 {
                font-size: var(--font-size-lg);
            }

            .footer {
                padding: var(--spacing-lg) var(--spacing-md);
                font-size: var(--font-size-xs);
            }
        }
    </style>
</head>
<body>
    <header class="header">
        <div class="header-content">
            <h1>Sistemas</h1>
            <p>SME Ribeirão Preto</p>
        </div>
    </header>

    <main class="main">
        <div class="intro">
            <h2>Bem-vindo ao Portal de Sistemas</h2>
            <p>Acesse os sistemas integrados da Secretaria Municipal de Educação</p>
        </div>

        <div class="grid" id="sistemas-grid"></div>
    </main>

    <footer class="footer">
        <p>Secretaria Municipal de Educação - Ribeirão Preto, SP</p>
    </footer>

    <div class="loading-indicator" id="loading" style="display: none;"></div>

    <script>
        const sistemas = [
            {
                id: 'relatorios',
                name: 'Relatórios',
                description: 'Visualize e gerencie relatórios do sistema educacional',
                icon: '📊',
                url: 'https://script.google.com/macros/s/AKfycbydArqsFE8fCijWuc_st3Kd3jbQaUWRyEnQja-Nh2dOaKueuV_jX0iaDyToMKRXjKHO/exec',
                color: 'accent'
            },
            {
                id: 'mapa',
                name: 'Mapa',
                description: 'Visualize informações geográficas da rede escolar',
                icon: '🗺️',
                url: 'https://script.google.com/a/macros/educacao.pmrp.sp.gov.br/s/AKfycbzjQwLUW_h8t6x6NeOGaptdbIm5rVjOGDAF1BlYI3n58od0A6t-LpJO3rE26GMZ_VzM/exec',
                color: 'success'
            }
        ];

        const grid = document.getElementById('sistemas-grid');
        const loading = document.getElementById('loading');

        sistemas.forEach((sistema) => {
            const card = document.createElement('button');
            card.className = `card card--${sistema.color}`;
            card.setAttribute('aria-label', `Acessar ${sistema.name}`);
            
            card.innerHTML = `
                <div class="card-icon">${sistema.icon}</div>
                <h3>${sistema.name}</h3>
                <p>${sistema.description}</p>
                <div class="card-arrow">→</div>
            `;

            card.addEventListener('click', () => {
                loading.style.display = 'block';
                setTimeout(() => {
                    window.location.href = sistema.url;
                }, 300);
            });

            grid.appendChild(card);
        });
    </script>
</body>
</html>
